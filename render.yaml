# Render Blueprint for MysteryVerse (https://render.com/docs/blueprint-spec).
# In Render: New > Blueprint > pick this repository. Render will ask for ADMIN_PASSWORD.
services:
  - type: web
    name: mysteryverse
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/status
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ADMIN_PASSWORD
        sync: false
